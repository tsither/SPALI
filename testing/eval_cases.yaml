      module: pm2
      semester: 3

  - id: pn04
    category: pin
    n_semesters: 6
    input: "I really don't want im in semester 1"
    expected:
      route: pin
      constraint_type: exclude_module_semester
      module: im
      semester: 1

  - id: pn05
    category: pin
    n_semesters: 6
    input: "schedule am31 for my last semester"
    expected:
      route: pin
      constraint_type: pin_module_semester
