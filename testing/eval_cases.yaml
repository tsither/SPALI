  # ---------------------------------------------------------------------
  # pin
  # ---------------------------------------------------------------------

  - id: pn01
    category: pin
    n_semesters: 6
    input: "put bm2 in my second semester"
    expected:
      route: pin
      constraint_type: pin_module_semester
      module: bm2
      semester: 2

  - id: pn02
    category: pin
    n_semesters: 6
    input: "I want to take the thesis in semester 6"
    expected:
      route: pin
      constraint_type: pin_module_semester
      module: msc
      semester: 6

  - id: pn03
    category: pin
    n_semesters: 5
    input: "keep pm2 out of my third semester"
    expected:
      route: pin
